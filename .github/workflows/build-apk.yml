name: France Clim Pro - APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Compiler et verifier APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tester le filtrage local des opportunites
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/radar-tests
          javac -encoding UTF-8 -d build/radar-tests app/src/main/java/fr/franceclim/pro/LeadClassifier.java tests/ClassifierSmoke.java
          java -cp build/radar-tests fr.franceclim.pro.ClassifierSmoke

      - name: Installer les outils Android
        uses: android-actions/setup-android@v4

      - name: Installer Android SDK 35 explicitement
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verifier la configuration
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          find app/src/main -maxdepth 7 -type f -print
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/fr/franceclim/pro/MainActivity.java

      - name: Compiler APK de debug
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Verifier que le package est installable
        shell: bash
        run: |
          set -euxo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -30
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          ls -lh "$apk"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: France-Clim-Pro-RADAR-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Conserver journal si echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: France-Clim-Pro-build-logs
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
